[project]
name = "kitchen-system"
version = "0.1.0"
description = "基于 ESP32 的后厨智能调度与食安合规管理系统 - 新选题独立工程"
requires-python = ">=3.11"
dependencies = []

# 唯一生产入口（审查报告 §3 "入口泛滥" P0）：装了本包后 `kitchen` 直接起
# API + 同源静态前端。tools/demos/ 下的是离线演示脚本，不是服务入口。
[project.scripts]
kitchen = "kitchen.api.server:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]
# 开发工具（不装也能跑、不影响交付）：ruff 只做"语法级"检查，
# 见 [tool.ruff]；没装时 tools/ci.py 会明示跳过，不伪造 PASS。
dev = ["pytest>=7.0", "ruff>=0.6"]
# A2 MQTT 真链路：不装也能跑（Inproc 进程内通道覆盖全部代码路径），
# 演示真 broker 用 `--amqtt`（内嵌）或 `--broker host:port`（EMQX 等）
mqtt = ["paho-mqtt>=2.0", "amqtt>=0.11"]
# A18 MySQL 后端：仅当设置 KITCHEN_DB_URL 时才 import pymysql。
# 裸机演示 / SQLite 路径 / 全部单测都不需要它（核心仍是零依赖标准库）。
# cryptography 是 8.4 默认 caching_sha2_password 的硬依赖：缺了它 pymysql
# 连不上，而且只在真正认证时才暴露（healthcheck 预热会把它藏起来）。
mysql = ["pymysql>=1.1,<2", "cryptography>=42"]

[tool.pytest.ini_options]
# 业务代码只在 src/ 下；vendor/ 是只读素材落点，不进 import 路径。
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--capture=sys -q"

[tool.ruff]
# 只开「语法级」三条：E9 语法错误、F63 % 格式化串非法、F7 语句层语法错。
# 为什么刻意不扩大：
#   · 业务级规则（BLE001 宽异常、ARG 未用参数、B bugbear）会引来大量存量噪音，
#     而本项目对"宽异常"的要求比 ruff 更严——`tools/review_lint.py` 要求写理由，
#     ruff 只要求有 noqa。两条并存会互相打脸，所以分工：语法级给 ruff，业务级给 review_lint。
#   · F82（未定义名）需要跨分支符号解析，本项目有 KITCHEN_DB_URL 条件导入 pymysql，
#     误报风险不为零，等真跑过一轮再评估。
# 本地未装 ruff 时 ci.py 会跳过本关（打印 SKIP），不会伪造通过。
target-version = "py311"
# 只扫自己的代码：vendor / Ultralytics 是第三方素材，datasets / runs / var 是产物，
# web / miniapp 不是 Python。扫进去只会制造噪音。
extend-exclude = [
    "vendor", "Ultralytics", ".local", "datasets", "runs", "var", "backups",
    "web", "miniapp", "deploy", "migrations", "firmware", "scenarios", "fixtures",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7"]
