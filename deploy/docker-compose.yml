# 后厨管理系统 - Docker Compose（A4）
# 用法：docker compose up -d ；日志：docker compose logs -f api
# MySQL 部署路径：migrations/001-017 在 mysql 服务首次启动时自动执行
# （./migrations 挂到 /docker-entrypoint-initdb.d，MySQL 官方镜像首启自动跑 .sql）。
#
# ⚠️ 上生产前必须改的三个值（.env 或直接改这里）：
#   KITCHEN_ADMIN_PASSWORD / KITCHEN_API_SECRET / MYSQL_ROOT_PASSWORD

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: kitchen-api
    ports:
      - "8848:8848"
    environment:
      # —— prod 安全（A5 基础）：账号口令只给 PBKDF2 摘要，见 accounts.py
      KITCHEN_ADMIN_PASSWORD: "${KITCHEN_ADMIN_PASSWORD:?请设置管理口令}"
      KITCHEN_API_SECRET: "${KITCHEN_API_SECRET:?请设置 API 签名密钥}"
      # —— MySQL 连接（A18 已接线，不再是预留）
      #    server.py 的 --db-url 从本变量读取 → AppStateConfig.db_url →
      #    storage/backend.py 走 pymysql 后端，遥测帧/告警事件写进 MySQL。
      #    优先级高于 Dockerfile CMD 里的 --db（SQLite 兜底）；
      #    mysql:// 一旦设置，连不上明确抛错，不静默退回文件库。
      KITCHEN_DB_URL: "mysql://kitchen:${MYSQL_PASSWORD}@mysql:3306/kitchen"
    volumes:
      - api_var:/app/var          # 队列/审计/运行时库持久化
      - api_backups:/app/backups  # 备份输出
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: kitchen-mysql
    environment:
      MYSQL_DATABASE: kitchen
      MYSQL_USER: kitchen
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?请设置 MySQL 口令}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请设置 root 口令}"
    volumes:
      - mysql_data:/var/lib/mysql
      # 17 份迁移 / 50 表 / 71 索引：首启自动执行（按文件名序 001→017）
      # 仅在 mysql_data 卷为空时执行；有旧数据时见 deploy/README.md §四第 3 条
      - ../migrations:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukitchen",
             "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 备份侧车：每天 02:00 打包 api_var 卷（14 天滚动）。
  # 简化口径：只做卷归档；MySQL 逻辑备份（mysqldump）未接入，见脚本头注释。
  backup:
    image: python:3.11-slim
    container_name: kitchen-backup
    volumes:
      - api_var:/source/var:ro
      - api_backups:/dest
      - ./backup-sidecar.sh:/backup-sidecar.sh:ro
    # 用独立脚本 + sh 显式执行：避开 compose 字符串插值（$$）与 % 转义的坑。
    # 2026-11-15 修正：原先内联 `sh -c "if [ $$((...%%...)) ...]"` 传给容器后
    # 变成非法算术表达式，容器每分钟崩一次（Restarting (2)）。
    entrypoint: ["sh", "/backup-sidecar.sh"]
    restart: unless-stopped

volumes:
  api_var:
  api_backups:
  mysql_data:
