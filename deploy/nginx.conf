# 后厨管理系统 - Nginx 反向代理（A4 / A20 阿里云）
#
# 部署位置：/etc/nginx/conf.d/kitchen.conf（conf.d 被 include 在 http{} 内，
# 所以下面的 limit_req_zone 放这里合法，不用改主配置 nginx.conf）。
#
# 换域名（上线前必做，把示例域名换成你自己的已备案域名）：
#   sudo sed -i 's/kitchen.example.com/你的域名/g' /etc/nginx/conf.d/kitchen.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 场景：api 服务起在 127.0.0.1:8848，nginx 对外 80/443。8848 不对公网开放。
#
# SSE 关键：/api/events 是长连接流（text/event-stream），必须关缓冲、
# 放长读超时，否则前端事件流每 60s 断一次重连（nginx 默认读超时）。

# 登录防爆破的边缘限速区。必须在 http{} 作用域声明，缺了它下面
# `limit_req zone=login` 会让 nginx -t 直接报 unknown limit_req_zone，起不来。
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name kitchen.example.com;

    # 阿里云备案/安全扫描常来探 /.well-known，证书签发时也别被 301 挡掉
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # 其余 HTTP 全部 301 到 HTTPS（证书就位后启用）
    return 301 https://$host$request_uri;
}

server {
    # ⚠️ 阿里云 Ubuntu 22.04/24.04 自带 nginx 为 1.18 / 1.24，不支持
    #    nginx≥1.25.1 才有的独立 `http2 on;` 指令（写了会 unknown directive）。
    #    用兼容写法 `listen 443 ssl http2;`，1.18 与 1.25+ 都能过。
    listen 443 ssl http2;
    server_name kitchen.example.com;

    # 证书路径（Let's Encrypt：certbot certonly --nginx -d kitchen.example.com）
    ssl_certificate     /etc/letsencrypt/live/kitchen.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitchen.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（A5 配套）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传/请求体上限：管理端客诉图片回传等场景
    client_max_body_size 10m;

    # 前端是 vite 构建的静态资源，压缩收益明显
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # —— SSE 事件流（最长连接）：必须放最前，通用 location 的 proxy_read_timeout 60s 会掐断它
    location /api/events {
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE 禁缓冲：缓冲会让前端收不到增量
        proxy_cache off;
        proxy_read_timeout 3600s;     # 长连接保持 1h（前端断线自动重连兜底）
        chunked_transfer_encoding on;
    }

    # —— REST API 与静态页
    location / {
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # —— 管理端敏感接口加一层来源限速（A5 配套：登录防爆破的边缘兜底）
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端开 --trust-proxy 时靠这个头识别真实来源，缺了会让所有人共用
        # 127.0.0.1 这个锁定键（一次爆破锁死全体管理员）
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
