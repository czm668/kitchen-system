# 后厨管理系统 - Nginx 反向代理（A4）
# 场景：api 服务起在 127.0.0.1:8848，nginx 对外 80/443。
# SSE 关键：/api/events 是长连接流（text/event-stream），必须关缓冲、
# 放长读超时，否则前端事件流每 60s 断一次重连（nginx 默认读超时）。

server {
    listen 80;
    server_name kitchen.example.com;

    # HTTP 全部 301 到 HTTPS（证书就位后启用）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kitchen.example.com;

    # 证书路径（Let's Encrypt：certbot certonly --nginx -d kitchen.example.com）
    ssl_certificate     /etc/letsencrypt/live/kitchen.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitchen.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 安全响应头（A5 配套）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传/请求体上限：管理端图片回传等场景
    client_max_body_size 10m;

    # —— SSE 事件流（最长连接）：必须放最前，通用 location 的 proxy_read_timeout 60s 会掐断它
    location /api/events {
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE 禁缓冲：缓冲会让前端收不到增量
        proxy_cache off;
        proxy_read_timeout 3600s;     # 长连接保持 1h（前端断线自动重连兜底）
        chunked_transfer_encoding on;
    }

    # —— REST API 与静态页
    location / {
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # —— 管理端敏感接口加一层来源限速（A5 配套：登录防爆破的边缘兜底）
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8848;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 限速区定义（放 http 块：nginx/conf.d 外层）
# limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
