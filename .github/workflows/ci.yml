# CI（A7）：只是 tools/ci.py 的平台包装——逻辑全部本地已验证。
# 前端构建产物（web/dist）不入库，所以这里先装 Node 把前端构建出来，
# 否则 web_check 的第一项「dist/index.html 存在」必然失败。
name: kitchen-ci

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支连推时取消上一次运行，别让几个 run 排队白跑
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建管理端（web_check 要验产物）
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 安装依赖（含可选组）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pytest-cov   # 覆盖率可选依赖，ci.py --cov 用

      - name: 跑全部质量关卡（pytest + 迁移校验 + web_check + miniapp_check）
        run: python tools/ci.py --cov

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
