# 视觉数据集配置（A5-02）
#
# 格式：Ultralytics YOLOv8 标准格式。`names` 的顺序就是模型输出的 class id，
# **必须与 `src/kitchen/vision/models.py` 的 `CLASSES` 完全一致**。
# 改顺序 = 帽子被认成手机：代码里完全看不出来，只有现场能看到「有人拿手机」
# 报警但其实是没戴帽。`python tools/vision_train.py --check` 会校验这一条。

path: datasets/vision          # 相对工程根（02_项目代码/kitchen）
train: images/train
val: images/val
test: images/test

names:
  0: person       # 人（含上半身/全身，按人头算）
  1: hat          # 厨师帽
  2: mask         # 口罩
  3: uniform      # 工服/围裙
  4: cigarette    # 香烟（含手持状态）
  5: phone        # 手机（含手持状态）

# ---------------------------------------------------------------- 标注规范
#
# 1. **person 框到脚**。工位归属按脚点判（`BBox.foot`），框不到脚就没法归属。
#    被操作台挡住下半身时，按可见部分的外接框标，并在 note 里注明 `occluded`。
# 2. **hat / mask / uniform 标「实物」而不是「人」**。帽框只框帽子，
#    不要框到整颗脑袋——判定层用「帽框落在头区域内的比例」算命中。
# 3. **cigarette / phone 只标手持或贴脸状态**。放在案板上的手机不算违规，
#    标了会让「玩手机」误报成灾。
# 4. **负样本很重要**：手抬起来擦汗、拿锅铲、端盘子这几类要单独收，
#    它们和「拿手机」在 416 分辨率下几乎一样。
# 5. 只标看得清的：置信度低于能确认的程度就 `skip`，不要猜。
#
# ---------------------------------------------------------------- 数据来源
#
# 公开集预训练 + 自有增量标注 300~500 张（任务清单 A5-02 口径）。
# 主体为工地 PPE 来源（Roboflow 导出：hh-* 硬帽人像 + cig-* 烟头特写 +
# mafa_* 口罩人脸）；2026-11-19 并入厨房实拍补集（见下方记录）。
#
# ---------------------------------------------------------------- phone 补齐记录
#
# 2026-11-19：phone 类此前零标注。用 COCO 底座（yolov8n.pt）做教师普查 +
# 人工逐框目检裁决（手持/贴脸才 accept，地上/口袋不标——对齐第 3 条规范）：
#   train 并入 59 框（58 张图）、val 并入 21 框（20 张图）、test 保持 0（held-out）。
# 工具与审计：tools/vision_label_patch.py（scan → sheet → commit），
# 裁决表与审计 JSON 在 var/phone_census/（不进 git）。
#
# ---------------------------------------------------------------- 厨房补集记录
#
# 2026-11-19：uniform 此前零标注（工地图像无工服实例，无法诚实补标）。
# 启用归档 chef_hat 素材（Mixkit Free 许可，真实后厨实拍，帽框语义合规，
