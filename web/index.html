<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- 之前没有图标，浏览器每次加载都会请求 /favicon.ico 拿一个 404，
         控制台留一条红字，标签页还是一个地球。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>后厨智能调度与食安合规管理系统</title>
    <!--
      在样式表之前定下主题。主题存在 localStorage 里，而 Vue 要到挂载时才读，
      中间这段时间用户看到的是下面那段启动屏——不提前定主题的话，浅色用户
      每次打开都会先闪一下深色屏。
      用 try/catch 包住：隐私模式下访问 localStorage 会抛异常，不能让它
      连带把后面的启动搞挂。
    -->
    <script>
      try {
        if (localStorage.getItem('kitchen.theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) { /* localStorage 不可用就用默认浅色 */ }
    </script>
  </head>
  <body>
    <!-- 首屏骨架：JS 还没下载完时先显示这个，避免白屏。
         Vue 挂载后会被整体替换，所以这里只放纯 CSS 字体与底色。 -->
    <div id="app">
      <div class="boot">
        <div class="boot-mark"></div>
        <p>正在连接后厨设备…</p>
      </div>
    </div>
    <!--
      骨架屏样式**只允许作用于 .boot 自己**。
      不能给 html/body 设置背景：这个 <style> 位于 body 中，比 <head> 里的主题
      样式表晚加载，同权重选择器后者胜——body 的主题背景（var(--bg)）会被这里的
      字面量永久覆盖，登录后主界面所有透明缝隙都会露出这套残留色（深浅主题串色、
      缝隙发白的元凶）。Vue 挂载后 .boot 节点被替换，这里的样式随选择器一起失效。
    -->
    <style>
      html, body { margin: 0; padding: 0; }
      .boot {
        height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        /* 跟随主题：深色是既有的深灰，浅色用与 --bg 同色，避免"先深后浅"的闪屏 */
        background: #f5f5f7; color: #6b6b70; font-size: 13px; letter-spacing: .08em;
      }
      :root[data-theme="dark"] .boot { background: #101114; color: #8a8f98; }
      .boot-mark {
        width: 34px; height: 34px; border-radius: 8px;
        border: 2px solid #d2d2d7; border-top-color: #6b6b70;
        animation: boot-spin 900ms linear infinite;
      }
      :root[data-theme="dark"] .boot-mark {
        border-color: #2a2e35; border-top-color: #8a8f98;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
